name: Build and Deploy Zig WASM to GitHub Pages

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build WASM & Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout with submodules and LFS
        uses: actions/checkout@v4
        with:
          submodules: recursive       # initialises and updates all submodules
          lfs: true                   # enables Git LFS during checkout
          fetch-depth: 0

      - name: Pull LFS objects
        run: git lfs pull

        # ── Zig ──────────────────────────────────────────────────────────────────
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0-dev.135+9df02121d

      - name: Confirm Zig version
        run: zig version

      - name: Build WASM
        run: zig build -Dtarget=wasm32-emscripten -Doptimize=ReleaseSmall

      - name: Prepare Pages directory
        run: |
          mkdir -p _site
          cp zig-out/web/* _site/    # compiled WASM blob(s)

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
